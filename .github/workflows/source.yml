name: Test Python application
on:
  push:
    branches: [main, 'gpt/console-polish', 'gpt/gittotte-stage1', 'gpt/folder-multiselect', 'gpt/local-records', 'gpt/route-review', 'gpt/file-choices', 'gpt/restoration', 'gpt/hover-colors', 'gpt/compare-selection', 'gpt/operation-guide']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-source:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Verify source GUI and terminal
        run: python -m gittotte --smoke-test build/source-smoke.json
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: GitTotte-source-diagnostics
          path: build/source-smoke*
          if-no-files-found: ignore
